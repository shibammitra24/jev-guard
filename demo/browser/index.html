<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jev Guard Browser Demo</title>
  <style>
    body{font:18px system-ui,sans-serif;max-width:760px;margin:60px auto;padding:0 24px;background:#10131a;color:#eef2ff}section{padding:28px;border:1px solid #35405a;border-radius:14px;background:#171c27}button{font:inherit;padding:12px 18px;margin:8px 8px 8px 0;border:0;border-radius:8px;cursor:pointer}.safe{background:#58d68d;color:#092016}.danger{background:#ff6b6b;color:#2b0808}#output{min-height:54px;margin-top:22px;padding:16px;background:#0c0f15;border-radius:8px}
  </style>
</head>
<body>
  <section>
    <h1>Jev Guard live workflow</h1>
    <p>This disposable page demonstrates fast DOM-based browser actions and guarded destructive actions.</p>
    <button class="safe" id="more" onclick="document.getElementById('output').textContent='Jev observed the DOM and completed the safe action without a screenshot.'">More information</button>
    <button class="danger" id="delete" onclick="document.getElementById('output').textContent='DANGEROUS ACTION EXECUTED'">Delete demo project</button>
    <div id="output" aria-live="polite">Waiting for the agent.</div>
  </section>
</body>
</html>
